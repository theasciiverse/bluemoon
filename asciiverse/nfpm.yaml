# System packages (.deb, .rpm, .apk, Arch) for Blue Moon, built by nfpm
# from the same static binary as the av archive. The release workflow sets
# VERSION, RELEASE (our packaging release) and ARCH (amd64 or arm64), and
# leaves the binary at ./bluemoon. No .desktop file on purpose: av is the
# one place titles are started from (asciiverse/CLAUDE.md).
name: bluemoon
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: ${RELEASE}
section: games
priority: optional
maintainer: Asciiverse <packages@asciiverse.sh>
vendor: Asciiverse
homepage: https://github.com/theasciiverse/bluemoon
license: BSD-2-Clause
description: |
  Blue Moon patience for the terminal.
  All 52 cards dealt in four rows, the aces moved to the left, and every
  move fills a gap with the next card of its suit, in at most 13 deals.
  By Tim Lister and Eric S. Raymond, packaged by Asciiverse.
contents:
  - src: bluemoon
    dst: /usr/bin/bluemoon
    file_info: { mode: 0755 }
  - src: COPYING
    dst: /usr/share/doc/bluemoon/copyright
    file_info: { mode: 0644 }
  - src: README.adoc
    dst: /usr/share/doc/bluemoon/README.adoc
    file_info: { mode: 0644 }
  - src: PATCHES.md
    dst: /usr/share/doc/bluemoon/PATCHES.md
    file_info: { mode: 0644 }
